<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2195" viewBox="0 0 1440 2195" role="img" aria-labelledby="title desc"><title id="title">班級作文講評完整數據流程</title><desc id="desc">已有作文報告經校驗、分類、統計選材、七章組裝及導出校驗，生成課堂材料。異常資料轉教師核對，可選AI預設關閉。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b" /></marker></defs><style>text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;fill:#243449}.title{font-size:28px;font-weight:650}.heading{font-size:19px;font-weight:650}.body{font-size:16px}.label{font-size:15px;fill:#53657c}.step{font-size:20px;font-weight:650;fill:#2057ab}</style><rect width="1440" height="2195" fill="#f6f8fc" rx="16" y="0" />
<text x="36" y="48" class="title">從已有作文報告，到作文課堂材料</text>
<text x="36" y="78" class="label">固定規則主流程｜原文與評語成對｜保留來源 ID、文字版本、關聯範圍與確認狀態</text>
<text x="36" y="119" class="step">01  現有報告數據 · 鎖定班級、作文任務及最終提交</text>
<rect x="36" y="139" width="212" height="110" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="54" y="169" class="heading">作文信息</text>
<text x="54" y="199" class="body">題目、文體</text>
<text x="54" y="224" class="body">已有教師要求</text>
<path d="M142 249 V295.45 H610" fill="none" stroke="#64748b" stroke-width="2" />
<rect x="268" y="139" width="212" height="110" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="286" y="169" class="heading">最終成績</text>
<text x="286" y="199" class="body">總分、分項分數</text>
<text x="286" y="224" class="body">各維度滿分</text>
<path d="M374 249 V295.45 H610" fill="none" stroke="#64748b" stroke-width="2" />
<rect x="500" y="139" width="212" height="110" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="518" y="169" class="heading">作文正文</text>
<text x="518" y="199" class="body">全文、自然段</text>
<text x="518" y="224" class="body">固定文字版本</text>
<path d="M606 249 V295.45 H610" fill="none" stroke="#64748b" stroke-width="2" />
<rect x="732" y="139" width="212" height="110" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="750" y="169" class="heading">已有評價</text>
<text x="750" y="199" class="body">整體優點與建議</text>
<text x="750" y="224" class="body">局部批注＋原文範圍</text>
<path d="M838 249 V295.45 H610" fill="none" stroke="#64748b" stroke-width="2" />
<rect x="964" y="139" width="212" height="110" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="982" y="169" class="heading">疑似錯別字</text>
<text x="982" y="199" class="body">疑似字詞、位置</text>
<text x="982" y="224" class="body">數量、來源與狀態</text>
<path d="M1070 249 V295.45 H610" fill="none" stroke="#64748b" stroke-width="2" />
<rect x="1196" y="139" width="212" height="110" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="1214" y="169" class="heading">訂正及圖片</text>
<text x="1214" y="199" class="body">原詞、建議詞、狀態</text>
<text x="1214" y="224" class="body">原稿／字跡區域</text>
<path d="M1302 249 V295.45 H610" fill="none" stroke="#64748b" stroke-width="2" />
<path d="M610 295.45 V364.03" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<text x="36" y="359.61" class="step">02  數據校驗</text>
<rect x="36" y="395" width="1100" height="132" rx="10" fill="#edf4ff" stroke="#b4ccef" />
<text x="54" y="425" class="heading">成績有效性 → 版本一致性 → 原文範圍 → 訂正狀態</text>
<text x="54" y="455" class="body">核對總分與分項滿分；未交不作零分，不補零、不反算。</text>
<text x="54" y="480" class="body">原文與批注必須同版且範圍有效；區分學生原稿錯誤與轉寫錯誤。</text>
<text x="54" y="505" class="body">通過 → 可用資料集；每條材料保留來源及校驗結果。</text>
<rect x="1170" y="395" width="234" height="132" rx="10" fill="#fff8e8" stroke="#e7cd93" />
<text x="1188" y="425" class="heading">異常與人工核對</text>
<text x="1188" y="455" class="body">班級／任務缺失：停止</text>
<text x="1188" y="480" class="body">單條缺失／越界：跳過</text>
<text x="1188" y="505" class="body">修正後重新校驗</text>
<path d="M1136 451 H1170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<path d="M1287 395 V326.42 H1105 V395" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5" />
<path d="M610 527 V564.69" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<text x="36" y="604.36" class="step">03  提取與分類 · 優點／問題 → 已有標籤優先 → 固定詞庫匹配</text>
<rect x="36" y="648" width="324" height="170" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="54" y="678" class="heading">內容</text>
<text x="54" y="708" class="body">人物特質、選材</text>
<text x="54" y="733" class="body">事例分析、喜愛理由</text>
<text x="54" y="758" class="body">個人體會</text>
<text x="54" y="783" class="body">提取：原文＋已有評語</text>
<path d="M198 818 V875 H610" fill="none" stroke="#64748b" stroke-width="2" />
<rect x="384" y="648" width="324" height="170" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="402" y="678" class="heading">表達</text>
<text x="402" y="708" class="body">詞語、修辭、描寫</text>
<text x="402" y="733" class="body">觀點表達、語句修訂</text>
<text x="402" y="758" class="body">書面語／粵語相關建議</text>
<text x="402" y="783" class="body">提取：目標詞＋關聯原句</text>
<path d="M546 818 V875 H610" fill="none" stroke="#64748b" stroke-width="2" />
<rect x="732" y="648" width="324" height="170" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="750" y="678" class="heading">結構</text>
<text x="750" y="708" class="body">開頭、結尾、首尾呼應</text>
<text x="750" y="733" class="body">過渡、銜接、層次詳略</text>
<text x="750" y="758" class="body">雙端明確才成對提取</text>
<text x="750" y="783" class="body">單端保留，不推斷關聯</text>
<path d="M894 818 V875 H610" fill="none" stroke="#64748b" stroke-width="2" />
<rect x="1080" y="648" width="324" height="170" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="1098" y="678" class="heading">標點字體</text>
<text x="1098" y="708" class="body">疑似／已有建議／已確認</text>
<text x="1098" y="733" class="body">字詞、標點、字跡分類</text>
<text x="1098" y="758" class="body">疑似不等於確定錯誤</text>
<text x="1098" y="783" class="body">提取：上下文＋已有訂正</text>
<path d="M1242 818 V875 H610" fill="none" stroke="#64748b" stroke-width="2" />
<text x="36" y="925.67" class="label">分類衝突、缺少明確原文關聯或狀態未確認 → 待核對清單；不新增評價、不按語義補配原文。</text>
<path d="M610 940.44 V963.67" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<text x="36" y="1005.89" class="step">04  統計與選材</text>
<rect x="36" y="1046" width="440" height="170" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="54" y="1076" class="heading">班級統計與共通問題</text>
<text x="54" y="1106" class="body">平均分及得分率按有效樣本計算</text>
<text x="54" y="1131" class="body">問題按「學生＋固定標籤」去重</text>
<text x="54" y="1156" class="body">至少 2 人；按涉及人數排序</text>
<text x="54" y="1181" class="body">頻次榜與有原文的前三方向分開</text>
<path d="M256 1216 V1262.08 H720" fill="none" stroke="#64748b" stroke-width="2" />
<rect x="500" y="1046" width="440" height="170" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="518" y="1076" class="heading">優點及問題案例</text>
<text x="518" y="1106" class="body">案例前 10 名優先；缺 1 組向後補 1 組</text>
<text x="518" y="1131" class="body">每人每類先取 1 組，再取剩餘材料</text>
<text x="518" y="1156" class="body">同來源範圍去重；無關聯則順延</text>
<text x="518" y="1181" class="body">全班不足：展示實際數量，不湊數</text>
<path d="M720 1216 V1262.08 H720" fill="none" stroke="#64748b" stroke-width="2" />
<rect x="964" y="1046" width="440" height="170" rx="10" fill="#ffffff" stroke="#d4deed" />
<text x="982" y="1076" class="heading">作文選讀與訂正</text>
<text x="982" y="1106" class="body">作文：本班最高分的完整原文</text>
<text x="982" y="1131" class="body">評語：已有優點 2 條＋建議 2 條</text>
<text x="982" y="1156" class="body">訂正：已確認且原詞／建議詞完整</text>
<text x="982" y="1181" class="body">同類訂正按涉及學生人數排序</text>
<path d="M1184 1216 V1262.08 H720" fill="none" stroke="#64748b" stroke-width="2" />
<path d="M720 1262.08 V1295.27" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<text x="36" y="1332.13" class="step">05  七章內容組裝 · 只使用通過校驗的入選材料</text>
<rect x="36" y="1369" width="180" height="115" rx="10" fill="#edf7f4" stroke="#bbdcd0" />
<text x="54" y="1399" class="heading">01 寫作要求</text>
<text x="54" y="1429" class="body">題目＋教師要求</text>
<rect x="234" y="1369" width="180" height="115" rx="10" fill="#edf7f4" stroke="#bbdcd0" />
<text x="252" y="1399" class="heading">02 班級概覽</text>
<text x="252" y="1429" class="body">分項平均＋共通方向</text>
<rect x="432" y="1369" width="180" height="115" rx="10" fill="#edf7f4" stroke="#bbdcd0" />
<text x="450" y="1399" class="heading">03 內容</text>
<text x="450" y="1429" class="body">原文＋對應建議</text>
<rect x="630" y="1369" width="180" height="115" rx="10" fill="#edf7f4" stroke="#bbdcd0" />
<text x="648" y="1399" class="heading">04 表達</text>
<text x="648" y="1429" class="body">詞語3／佳句3</text>
<text x="648" y="1454" class="body">語句問題1—2</text>
<rect x="828" y="1369" width="180" height="115" rx="10" fill="#edf7f4" stroke="#bbdcd0" />
<text x="846" y="1399" class="heading">05 結構</text>
<text x="846" y="1429" class="body">雙端對照</text>
<text x="846" y="1454" class="body">或單端選讀</text>
<rect x="1026" y="1369" width="180" height="115" rx="10" fill="#edf7f4" stroke="#bbdcd0" />
<text x="1044" y="1399" class="heading">06 標點字體</text>
<text x="1044" y="1429" class="body">訂正5例＋上下文</text>
<text x="1044" y="1454" class="body">每頁最多5例</text>
<rect x="1224" y="1369" width="180" height="115" rx="10" fill="#edf7f4" stroke="#bbdcd0" />
<text x="1242" y="1399" class="heading">07 作文選讀</text>
<text x="1242" y="1429" class="body">最高分全文</text>
<text x="1242" y="1454" class="body">已有評語2＋2</text>
<path d="M720 1484 V1549.08" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="36" y="1555" width="1368" height="96" rx="10" fill="#edf4ff" stroke="#b4ccef" />
<text x="54" y="1585" class="heading">統一內容清單 · 文字稿與 PPT 共用一份資料</text>
<text x="54" y="1615" class="body">章節、正文、已有評語、來源 ID、位置、版本、狀態、跳過原因；缺雙端不拼接，無有效子頁隱藏，長文續頁。</text>
<path d="M720 1651 V1677.11" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<text x="36" y="1710.19" class="step">06  導出校驗與交付</text>
<rect x="36" y="1745" width="888" height="115" rx="10" fill="#edf7f4" stroke="#bbdcd0" />
<text x="54" y="1775" class="heading">一致性與版面檢查 → 課堂文字稿／PPT</text>
<text x="54" y="1805" class="body">核對原文可完整還原；檢查重複、缺漏、佔位符及排版溢出。</text>
<text x="54" y="1830" class="body">原型現可導出 MD；PPT 導出待接入。</text>
<rect x="958" y="1745" width="446" height="115" rx="10" fill="#fff8e8" stroke="#e7cd93" />
<text x="976" y="1775" class="heading">教師備選＋待確認事項</text>
<text x="976" y="1805" class="body">不足、分類衝突、疑似錯字、缺失關聯單列。</text>
<text x="976" y="1830" class="body">導出失敗：保留清單，不標記正式成品。</text>
<path d="M924 1803 H958" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<rect x="36" y="1918" width="1368" height="183" rx="10" fill="#f4f0ff" stroke="#b9a9db" stroke-dasharray="7 5" />
<text x="56" y="1952" class="heading">可選 AI 分支 · 預設關閉，材料不足不自動觸發</text>
<text x="56" y="1987" class="body">明確啟用 → 限定原文與候選 ID → AI 返回候選 → 系統校驗 → 教師確認 → 按規則入庫</text>
<text x="56" y="2020" class="body">僅允許白名單標籤、候選詞 ID 或最小訂正建議；可返回「無法判斷」。</text>
<text x="56" y="2053" class="body">不得創建來源 ID、自報已確認、補寫範文或為湊數生成材料；入庫後返回主流程重新校驗。</text>
<text x="36" y="2140" class="label">全程追溯：記錄異常對象、原因、影響範圍、處理結果及教師確認狀態；原文版本變更後重新核對。</text>
<text x="36" y="2170" class="label">本圖展示生成規則與目標流程；原型未連接正式後台，並不代表所有導出能力已接入。</text>
</svg>